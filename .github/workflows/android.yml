name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessary to count commits since last version change

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew :app:assembleDebug

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Lint
        run: ./gradlew :app:lintRelease

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ build, lint ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Calculate Version Parts
        id: versioning
        run: |
          # 1. Minor Version: Count commits since the last time majorVersion was changed in build.gradle.kts
          LAST_MAJOR_CHANGE=$(git log -G "val majorVersion =" -n 1 --pretty=format:%H -- app/build.gradle.kts)
          if [ -z "$LAST_MAJOR_CHANGE" ]; then
            MINOR_VERSION=$(git rev-list --count HEAD)
          else
            MINOR_VERSION=$(git rev-list --count ${LAST_MAJOR_CHANGE}..HEAD)
          fi
          
          # 2. Patch Version: Use GitHub Run Number
          PATCH_VERSION=${{ github.run_number }}
          
          echo "minor=$MINOR_VERSION" >> $GITHUB_OUTPUT
          echo "patch=$PATCH_VERSION" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ../release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PminorVersion=${{ steps.versioning.outputs.minor }} \
            -PpatchVersion=${{ steps.versioning.outputs.patch }}

      - name: Rename APK
        run: |
          MAJOR_VERSION=$(grep "val majorVersion =" app/build.gradle.kts | awk -F'=' '{print $2}' | xargs)
          MINOR_VERSION=${{ steps.versioning.outputs.minor }}
          PATCH_VERSION=${{ steps.versioning.outputs.patch }}
          mv app/build/outputs/apk/release/*.apk "AutoWallpaper ${MAJOR_VERSION}.${MINOR_VERSION}.${PATCH_VERSION}.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: "AutoWallpaper *.apk"
