name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build, Test and Lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:verifyRoborazziDebug :app:lintDebug --no-daemon

      - name: Lint Report
        uses: hidakatsuya/action-report-android-lint@v1
        if: always()
        with:
          report-path: app/build/reports/lint-results-debug.xml

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests (Debug)
          path: 'app/build/test-results/testDebugUnitTest/*.xml'
          reporter: java-junit

      - name: Upload Screenshot Comparison Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-report
          path: app/build/reports/roborazzi/

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-debug
          path: app/build/reports/lint-results-debug.html

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ debug ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Calculate Version Parts
        id: versioning
        run: |
          LAST_MAJOR_CHANGE=$(git log -G "val majorVersion =" -n 1 --pretty=format:%H -- app/build.gradle.kts)
          if [ -z "$LAST_MAJOR_CHANGE" ]; then
            MINOR_VERSION=$(git rev-list --count HEAD)
          else
            MINOR_VERSION=$(git rev-list --count ${LAST_MAJOR_CHANGE}..HEAD)
          fi
          PATCH_VERSION=${{ github.run_number }}
          echo "minor=$MINOR_VERSION" >> $GITHUB_OUTPUT
          echo "patch=$PATCH_VERSION" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > release.jks

      - name: Build Release and Lint
        env:
          KEYSTORE_PATH: ../release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:lintRelease :app:assembleRelease \
            -PminorVersion=${{ steps.versioning.outputs.minor }} \
            -PpatchVersion=${{ steps.versioning.outputs.patch }} \
            --no-daemon

      - name: Lint Report
        uses: hidakatsuya/action-report-android-lint@v1
        if: always()
        with:
          report-path: app/build/reports/lint-results-release.xml

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-release
          path: app/build/reports/lint-results-release.html

      - name: Rename APK
        run: |
          MAJOR_VERSION=$(grep "val majorVersion =" app/build.gradle.kts | awk -F'=' '{print $2}' | xargs)
          MINOR_VERSION=${{ steps.versioning.outputs.minor }}
          PATCH_VERSION=${{ steps.versioning.outputs.patch }}
          mv app/build/outputs/apk/release/*.apk "AutoWallpaper ${MAJOR_VERSION}.${MINOR_VERSION}.${PATCH_VERSION}.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: "AutoWallpaper *.apk"
